<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="1924" viewBox="-30 0 1210 1924" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Gesamtarchitektur des Studien-Dashboards</title>
  <desc id="diagram-desc">UML-Gesamtarchitektur mit 14 eigenen Anwendungsklassen. Der Studiengang enthält Bezeichnung, Startdatum, Regelstudienzeit, Gesamt-ECTS und Zielnote. Sein Enddatum ergibt sich aus sechs Kalendermonaten je Semester. Semester enthalten keine Datumsangaben. Die abstrakte Prüfungsleistung hat zwei konkrete Unterklassen. Die Prüfungsform ist ein Enum. Fachliche Attribute stehen in den Klassenkästen oder werden durch Beziehungen dargestellt.</desc>
  <defs>
    <style>
      text { font-family: "Liberation Sans", Arial, sans-serif; fill: #172033; }
      .section { fill: #f8fafc; stroke: #d7e0ea; stroke-width: 1.5; }
      .section-title { font-size: 25px; font-weight: 700; fill: #334155; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2.2; }
      .header { fill: #e8eef7; }
      .abstract-header { fill: #eef0fa; }
      .enum-header { fill: #f0f3f6; }
      .module-header { fill: #e5f1ec; }
      .outline { fill: none; stroke: #334155; stroke-width: 2.2; }
      .separator { stroke: #8493a5; stroke-width: 1.5; }
      .name { font-size: 26px; font-weight: 700; text-anchor: middle; }
      .abstract-name { font-size: 26px; font-weight: 700; font-style: italic; text-anchor: middle; }
      .base { font-size: 21px; text-anchor: middle; fill: #526176; }
      .stereotype { font-size: 20px; text-anchor: middle; fill: #526176; }
      .member { font-size: 24px; }
      .abstract-member { font-size: 24px; font-style: italic; }
      .relation { fill: none; stroke: #334155; stroke-width: 2.5; stroke-linejoin: round; }
      .dependency { fill: none; stroke: #526176; stroke-width: 2.2; stroke-dasharray: 8 6; stroke-linejoin: round; }
      .diamond-filled { fill: #334155; stroke: #334155; stroke-width: 2.2; }
      .diamond-open, .inheritance { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .multiplicity { font-size: 22px; font-weight: 700; fill: #334155; }
      .relation-label { font-size: 22px; fill: #526176; }
    </style>
    <marker id="use-arrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 1 L13 7 L2 13" fill="none" stroke="#526176" stroke-width="2.2" stroke-linejoin="round"/>
    </marker>
  </defs>

