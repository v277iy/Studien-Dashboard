<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="1120" viewBox="0 0 1530 1120">
  <title>UML-Klassendiagramm des Studien-Dashboards</title>
  <desc>Entity-Klassen Studiengang, Semester, Modul und Prüfungsleistung mit einteiligen, mehrteiligen und konkreten Prüfungsarten sowie Komposition, Aggregation, Status- und Ergebniswerten.</desc>

  <defs>
    <style>
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .header { fill: #e8eef7; }
      .separator { stroke: #334155; stroke-width: 2; }
      .relation { fill: none; stroke: #334155; stroke-width: 2.8; stroke-linecap: square; stroke-linejoin: miter; }
      .diamond-filled { fill: #334155; stroke: #334155; stroke-width: 2.2; }
      .diamond-open { fill: #ffffff; stroke: #334155; stroke-width: 2.2; }
      .inheritance { fill: #ffffff; stroke: #334155; stroke-width: 2.8; }
      .stereotype { font-family: "Liberation Sans", Arial, sans-serif; font-size: 16px; font-style: italic; fill: #475569; text-anchor: middle; }
      .class-name { font-family: "Liberation Sans", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .member { font-family: "Liberation Sans", Arial, sans-serif; font-size: 18px; fill: #1f2937; }
      .abstract-member { font-family: "Liberation Sans", Arial, sans-serif; font-size: 18px; font-style: italic; fill: #1f2937; }
      .association-label { font-family: "Liberation Sans", Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .multiplicity { font-family: "Liberation Sans", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #334155; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1530" height="1120" fill="#ffffff"/>

  <!-- Beziehungen der oberen Ebene -->
  <path class="relation" d="M420 170 H560"/>
  <polygon class="diamond-filled" points="420,170 436,157 452,170 436,183"/>
  <text x="490" y="149" class="association-label">besteht aus</text>
  <text x="430" y="202" class="multiplicity">1</text>
  <text x="530" y="202" class="multiplicity">1..*</text>

  <path class="relation" d="M900 150 H1050"/>
  <polygon class="diamond-open" points="900,150 916,137 932,150 916,163"/>
  <text x="975" y="129" class="association-label">ordnet zu</text>
  <text x="910" y="182" class="multiplicity">1</text>
  <text x="1020" y="182" class="multiplicity">0..*</text>

  <!-- Komposition Modul/Prüfungsleistung -->
  <path class="relation" d="M1280 265 V350 H775 V390"/>
  <polygon class="diamond-filled" points="1280,265 1293,279 1280,293 1267,279"/>
  <text x="1027.5" y="338" class="association-label">besitzt</text>
  <text x="1306" y="311" class="multiplicity">1</text>
  <text x="796" y="379" class="multiplicity">1</text>

  <!-- Vererbung der Prüfungsformen -->
  <path class="relation" d="M775 714 V728 H550 M775 728 H1165 M550 728 V750 M1165 728 V750"/>
  <polygon class="inheritance" points="775,690 759,714 791,714"/>

  <!-- Vererbung der konkreten Prüfungsarten -->
  <path class="relation" d="M550 909 V960 H410 M550 960 H675 M410 960 V1000 M675 960 V1000"/>
  <polygon class="inheritance" points="550,885 534,909 566,909"/>
  <path class="relation" d="M1165 954 V975 H1015 M1165 975 H1350 M1015 975 V1000 M1350 975 V1000"/>
  <polygon class="inheritance" points="1165,930 1149,954 1181,954"/>

  <!-- Studiengang -->
  <g>
    <rect x="20" y="20" width="400" height="320" rx="3" class="box"/>
    <path d="M23 20 H417 A3 3 0 0 1 420 23 V85 H20 V23 A3 3 0 0 1 23 20 Z" class="header"/>
    <line x1="20" y1="85" x2="420" y2="85" class="separator"/>
    <text x="220" y="45" class="stereotype">«Entity»</text>
    <text x="220" y="72" class="class-name">Studiengang</text>

    <text x="38" y="113" class="member">− bezeichnung: String</text>
    <text x="38" y="139" class="member">− startdatum: Date</text>
    <text x="38" y="165" class="member">− regelstudienzeit: Integer</text>
    <text x="38" y="191" class="member">− gesamtECTS: Integer</text>
    <text x="38" y="217" class="member">− zielnote: Decimal</text>

    <line x1="20" y1="234" x2="420" y2="234" class="separator"/>
    <text x="38" y="263" class="member">+ ectsFortschritt(): Prozent</text>
    <text x="38" y="289" class="member">+ notendurchschnitt(): Decimal [0..1]</text>
    <text x="38" y="315" class="member">+ verbleibendeSemester(): Integer</text>
  </g>

  <!-- Semester -->
  <g>
    <rect x="560" y="20" width="340" height="220" rx="3" class="box"/>
    <path d="M563 20 H897 A3 3 0 0 1 900 23 V85 H560 V23 A3 3 0 0 1 563 20 Z" class="header"/>
    <line x1="560" y1="85" x2="900" y2="85" class="separator"/>
    <text x="730" y="45" class="stereotype">«Entity»</text>
    <text x="730" y="72" class="class-name">Semester</text>

    <text x="578" y="113" class="member">− nummer: Integer</text>
    <text x="578" y="139" class="member">− beginn: Date</text>
    <text x="578" y="165" class="member">− ende: Date</text>

    <line x1="560" y1="182" x2="900" y2="182" class="separator"/>
    <text x="578" y="211" class="member">+ erreichteECTS(): Integer</text>
  </g>

  <!-- Modul -->
  <g>
    <rect x="1050" y="20" width="460" height="245" rx="3" class="box"/>
    <path d="M1053 20 H1507 A3 3 0 0 1 1510 23 V85 H1050 V23 A3 3 0 0 1 1053 20 Z" class="header"/>
    <line x1="1050" y1="85" x2="1510" y2="85" class="separator"/>
    <text x="1280" y="45" class="stereotype">«Entity»</text>
    <text x="1280" y="72" class="class-name">Modul</text>

    <text x="1068" y="113" class="member">− modulcode: String</text>
    <text x="1068" y="139" class="member">− bezeichnung: String</text>
    <text x="1068" y="165" class="member">− ects: Integer</text>
    <text x="1068" y="191" class="member">− status: Bearbeitungsstatus</text>

    <line x1="1050" y1="208" x2="1510" y2="208" class="separator"/>
    <text x="1068" y="240" class="member">+ fortschritt(): Prozent</text>
  </g>

  <!-- Abstrakte Prüfungsleistung -->
  <g>
    <rect x="465" y="390" width="620" height="300" rx="3" class="box"/>
    <path d="M468 390 H1082 A3 3 0 0 1 1085 393 V455 H465 V393 A3 3 0 0 1 468 390 Z" class="header"/>
    <line x1="465" y1="455" x2="1085" y2="455" class="separator"/>
    <text x="775" y="415" class="stereotype">«Entity»</text>
    <text x="775" y="442" class="class-name" font-style="italic">Prüfungsleistung</text>

    <text x="483" y="488" class="member">− termin: Date [0..1]</text>
    <text x="483" y="520" class="member">− note: Decimal [0..1]</text>
    <text x="483" y="552" class="member">− ergebnis: Prüfungsergebnis [0..1]</text>

    <line x1="465" y1="575" x2="1085" y2="575" class="separator"/>
    <text x="483" y="610" class="abstract-member">+ fortschritt(): Prozent {abstract}</text>
    <text x="483" y="645" class="member">+ istBestanden(): Boolean</text>
  </g>

  <!-- Ergebnis-Enumeration -->
  <g>
    <rect x="20" y="430" width="270" height="195" rx="3" class="box"/>
    <path d="M23 430 H287 A3 3 0 0 1 290 433 V505 H20 V433 A3 3 0 0 1 23 430 Z" class="header"/>
    <line x1="20" y1="505" x2="290" y2="505" class="separator"/>
    <text x="155" y="456" class="stereotype">«enumeration»</text>
    <text x="155" y="485" class="class-name" font-size="20">Prüfungsergebnis</text>
    <text x="38" y="538" class="member">AUSSTEHEND</text>
    <text x="38" y="570" class="member">BESTANDEN</text>
    <text x="38" y="602" class="member">NICHT_BESTANDEN</text>
  </g>


  <!-- Status-Enumeration -->
  <g>
    <rect x="20" y="725" width="235" height="200" rx="3" class="box"/>
    <path d="M23 725 H252 A3 3 0 0 1 255 728 V800 H20 V728 A3 3 0 0 1 23 725 Z" class="header"/>
    <line x1="20" y1="800" x2="255" y2="800" class="separator"/>
    <text x="137.5" y="751" class="stereotype">«enumeration»</text>
    <text x="137.5" y="780" class="class-name" font-size="20">Bearbeitungsstatus</text>
    <text x="38" y="833" class="member">NOCH_ZU_TUN</text>
    <text x="38" y="865" class="member">IN_BEARBEITUNG</text>
    <text x="38" y="897" class="member">FERTIG</text>
  </g>

  <!-- Abstrakte einteilige Prüfungsleistung -->
  <g>
    <rect x="300" y="750" width="500" height="135" rx="3" class="box"/>
    <path d="M303 750 H797 A3 3 0 0 1 800 753 V815 H300 V753 A3 3 0 0 1 303 750 Z" class="header"/>
    <line x1="300" y1="815" x2="800" y2="815" class="separator"/>
    <text x="550" y="775" class="stereotype">«Entity»</text>
    <text x="550" y="802" class="class-name" font-size="20" font-style="italic">Einteilige Prüfungsleistung</text>
    <text x="318" y="853" class="member">+ fortschritt(): Prozent</text>
  </g>

  <!-- Abstrakte mehrteilige Prüfungsleistung -->
  <g>
    <rect x="820" y="750" width="690" height="180" rx="3" class="box"/>
    <path d="M823 750 H1507 A3 3 0 0 1 1510 753 V815 H820 V753 A3 3 0 0 1 823 750 Z" class="header"/>
    <line x1="820" y1="815" x2="1510" y2="815" class="separator"/>
    <text x="1165" y="775" class="stereotype">«Entity»</text>
    <text x="1165" y="802" class="class-name" font-style="italic">Mehrteilige Prüfungsleistung</text>
    <text x="838" y="844" class="member">− anzahlAbschnitte: Integer</text>
    <text x="838" y="870" class="member">− aktuellerAbschnitt: Integer [0..1]</text>
    <line x1="820" y1="887" x2="1510" y2="887" class="separator"/>
    <text x="838" y="917" class="member">+ fortschritt(): Prozent</text>
  </g>

  <!-- Konkrete einteilige Prüfungsarten -->
  <g>
    <rect x="300" y="1000" width="220" height="90" rx="3" class="box"/>
    <path d="M303 1000 H517 A3 3 0 0 1 520 1003 V1065 H300 V1003 A3 3 0 0 1 303 1000 Z" class="header"/>
    <line x1="300" y1="1065" x2="520" y2="1065" class="separator"/>
    <text x="410" y="1025" class="stereotype">«Entity»</text>
    <text x="410" y="1052" class="class-name">Klausur</text>
  </g>
  <g>
    <rect x="550" y="1000" width="250" height="90" rx="3" class="box"/>
    <path d="M553 1000 H797 A3 3 0 0 1 800 1003 V1065 H550 V1003 A3 3 0 0 1 553 1000 Z" class="header"/>
    <line x1="550" y1="1065" x2="800" y2="1065" class="separator"/>
    <text x="675" y="1025" class="stereotype">«Entity»</text>
    <text x="675" y="1052" class="class-name" font-size="20">Fallstudie</text>
  </g>

  <!-- Konkrete mehrteilige Prüfungsarten -->
  <g>
    <rect x="900" y="1000" width="230" height="90" rx="3" class="box"/>
    <path d="M903 1000 H1127 A3 3 0 0 1 1130 1003 V1065 H900 V1003 A3 3 0 0 1 903 1000 Z" class="header"/>
    <line x1="900" y1="1065" x2="1130" y2="1065" class="separator"/>
    <text x="1015" y="1025" class="stereotype">«Entity»</text>
    <text x="1015" y="1052" class="class-name" font-size="20">Portfolio</text>
  </g>
  <g>
    <rect x="1190" y="1000" width="320" height="90" rx="3" class="box"/>
    <path d="M1193 1000 H1507 A3 3 0 0 1 1510 1003 V1065 H1190 V1003 A3 3 0 0 1 1193 1000 Z" class="header"/>
    <line x1="1190" y1="1065" x2="1510" y2="1065" class="separator"/>
    <text x="1350" y="1025" class="stereotype">«Entity»</text>
    <text x="1350" y="1052" class="class-name" font-size="18">Projektpräsentation</text>
  </g>
</svg>
