  <g>
    <rect x="663" y="330" width="337" height="48" rx="10" fill="#fff3cf"/>
    <circle cx="687" cy="354" r="7" fill="#f59e0b"/>
    <text x="704" y="359" class="ui label">In Bearbeitung</text>
    <rect x="958" y="342" width="25" height="23" rx="11.5" fill="#ffffff"/>
    <text x="970.5" y="358" text-anchor="middle" class="ui tiny" font-weight="700">2</text>
  </g>
  <g>
    <rect x="1020" y="330" width="337" height="48" rx="10" fill="#dcfce7"/>
    <circle cx="1044" cy="354" r="7" fill="#22c55e"/>
    <text x="1061" y="359" class="ui label">Fertig</text>
    <rect x="1315" y="342" width="25" height="23" rx="11.5" fill="#ffffff"/>
    <text x="1327.5" y="358" text-anchor="middle" class="ui tiny" font-weight="700">3</text>
  </g>

  <!-- Karten, durch Board geclippt -->
  <g clip-path="url(#boardClip)">
    <!-- Noch zu tun -->
    <g filter="url(#shadow)">
      <rect x="306" y="394" width="337" height="110" rx="10" fill="#ffffff"/>
      <rect x="306" y="394" width="5" height="110" rx="2.5" fill="#94a3b8"/>
