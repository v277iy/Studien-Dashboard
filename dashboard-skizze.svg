    <text x="325" y="419" class="ui card-title">Mathematik II</text>
    <text x="625" y="419" text-anchor="end" class="muted small">⋯</text>
    <text x="325" y="442" class="muted small">Klausur · 5 ECTS</text>
    <rect x="325" y="458" width="111" height="23" rx="11" fill="#edf1f6"/>
    <text x="380.5" y="474" text-anchor="middle" class="muted tiny" font-weight="700">NICHT BEGONNEN</text>
    <text x="625" y="475" text-anchor="end" class="muted tiny">Termin: 18.07.</text>

    <g filter="url(#shadow)">
      <rect x="306" y="520" width="337" height="121" rx="10" fill="#ffffff"/>
      <rect x="306" y="520" width="5" height="121" rx="2.5" fill="#94a3b8"/>
    </g>
    <text x="325" y="545" class="ui card-title">Software Engineering</text>
    <text x="625" y="545" text-anchor="end" class="muted small">⋯</text>
    <text x="325" y="568" class="muted small">Portfolio · 5 ECTS</text>
    <text x="325" y="593" class="muted tiny">3 Abschnitte · noch nicht begonnen</text>
    <rect x="325" y="603" width="286" height="8" rx="4" fill="#e2e8f0"/>

    <g filter="url(#shadow)">
      <rect x="306" y="657" width="337" height="110" rx="10" fill="#ffffff"/>
      <rect x="306" y="657" width="5" height="110" rx="2.5" fill="#94a3b8"/>
    </g>
    <text x="325" y="682" class="ui card-title">Statistik</text>
    <text x="625" y="682" text-anchor="end" class="muted small">⋯</text>
    <text x="325" y="705" class="muted small">Klausur · 5 ECTS</text>
    <rect x="325" y="721" width="111" height="23" rx="11" fill="#edf1f6"/>
    <text x="380.5" y="737" text-anchor="middle" class="muted tiny" font-weight="700">NICHT BEGONNEN</text>

    <!-- In Bearbeitung -->
