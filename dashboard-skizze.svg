  <text x="1148" y="185" class="muted small">Geplantes Enddatum</text>
  <text x="1148" y="215" class="ui value">01.09.2027</text>
  <text x="1148" y="238" class="muted tiny">Noch 3 Semester</text>

  <!-- Kanban-Bereich -->
