  <rect x="1374" y="398" width="8" height="146" rx="4" fill="#9aa9bb"/>
  <rect x="306" y="821" width="1051" height="8" rx="4" fill="#dce3eb"/>
  <rect x="310" y="821" width="680" height="8" rx="4" fill="#9aa9bb"/>
