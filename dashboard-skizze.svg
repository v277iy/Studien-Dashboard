  <rect x="286" y="310" width="1112" height="541" rx="12" fill="#f5f7fa" stroke="#cbd5e1"/>

  <!-- Spaltenköpfe -->
  <g>
    <rect x="306" y="330" width="337" height="48" rx="10" fill="#e7edf5"/>
    <circle cx="330" cy="354" r="7" fill="#94a3b8"/>
    <text x="347" y="359" class="ui label">Noch zu tun</text>
    <rect x="601" y="342" width="25" height="23" rx="11.5" fill="#ffffff"/>
    <text x="613.5" y="358" text-anchor="middle" class="ui tiny" font-weight="700">3</text>
