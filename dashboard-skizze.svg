    <text x="1039" y="671" class="ui card-title">Wissenschaftliches Arbeiten</text>
    <text x="1339" y="671" text-anchor="end" class="muted small">⋯</text>
    <text x="1039" y="694" class="muted small">Fallstudie · 5 ECTS</text>
    <rect x="1039" y="710" width="75" height="23" rx="11" fill="#dcfce7"/>
    <text x="1076.5" y="726" text-anchor="middle" fill="#137333" font-family="Liberation Sans, Arial" font-size="11" font-weight="700">BESTANDEN</text>
