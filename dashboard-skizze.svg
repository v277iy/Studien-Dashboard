      <rect x="663" y="394" width="337" height="126" rx="10" fill="#ffffff"/>
      <rect x="663" y="394" width="5" height="126" rx="2.5" fill="#f59e0b"/>
    </g>
    <text x="682" y="419" class="ui card-title">OOP mit Python</text>
    <text x="982" y="419" text-anchor="end" class="muted small">⋯</text>
    <text x="682" y="442" class="muted small">Portfolio · 5 ECTS</text>
    <text x="682" y="469" class="muted tiny">Aktueller Abschnitt: 2 von 4</text>
    <rect x="682" y="479" width="286" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="682" y="479" width="143" height="8" rx="4" fill="#f59e0b"/>
    <text x="968" y="505" text-anchor="end" fill="#9a6700" font-family="Liberation Sans, Arial" font-size="11" font-weight="700">50 %</text>

    <g filter="url(#shadow)">
      <rect x="663" y="536" width="337" height="126" rx="10" fill="#ffffff"/>
      <rect x="663" y="536" width="5" height="126" rx="2.5" fill="#f59e0b"/>
    </g>
    <text x="682" y="561" class="ui card-title">Datenbanken</text>
    <text x="982" y="561" text-anchor="end" class="muted small">⋯</text>
    <text x="682" y="584" class="muted small">Klausur · 5 ECTS</text>
    <rect x="682" y="603" width="139" height="23" rx="11.5" fill="#fff3cf"/>
    <text x="751.5" y="619" text-anchor="middle" fill="#9a6700" font-family="Liberation Sans, Arial" font-size="11" font-weight="700">IN VORBEREITUNG</text>
    <text x="968" y="619" text-anchor="end" class="muted tiny">Prüfung: 04.07.</text>

    <!-- Fertig -->
    <g filter="url(#shadow)">
      <rect x="1020" y="394" width="337" height="110" rx="10" fill="#ffffff"/>
      <rect x="1020" y="394" width="5" height="110" rx="2.5" fill="#22c55e"/>
    </g>
    <text x="1039" y="419" class="ui card-title">Programmierung I</text>
    <text x="1339" y="419" text-anchor="end" class="muted small">⋯</text>
    <text x="1039" y="442" class="muted small">Klausur · 5 ECTS</text>
    <rect x="1039" y="458" width="75" height="23" rx="11" fill="#dcfce7"/>
    <text x="1076.5" y="474" text-anchor="middle" fill="#137333" font-family="Liberation Sans, Arial" font-size="11" font-weight="700">BESTANDEN</text>
    <text x="1339" y="475" text-anchor="end" class="ui small" font-weight="700">Note 1,7</text>

    <g filter="url(#shadow)">
      <rect x="1020" y="520" width="337" height="110" rx="10" fill="#ffffff"/>
      <rect x="1020" y="520" width="5" height="110" rx="2.5" fill="#22c55e"/>
    </g>
    <text x="1039" y="545" class="ui card-title">Mathematik I</text>
    <text x="1339" y="545" text-anchor="end" class="muted small">⋯</text>
    <text x="1039" y="568" class="muted small">Klausur · 5 ECTS</text>
    <rect x="1039" y="584" width="75" height="23" rx="11" fill="#dcfce7"/>
    <text x="1076.5" y="600" text-anchor="middle" fill="#137333" font-family="Liberation Sans, Arial" font-size="11" font-weight="700">BESTANDEN</text>
    <text x="1339" y="601" text-anchor="end" class="ui small" font-weight="700">Note 2,3</text>

    <g filter="url(#shadow)">
      <rect x="1020" y="646" width="337" height="110" rx="10" fill="#ffffff"/>
      <rect x="1020" y="646" width="5" height="110" rx="2.5" fill="#22c55e"/>
